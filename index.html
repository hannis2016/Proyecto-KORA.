<!DOCTYPE html>
<html lang="es">

<head>
	<title>KORA</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

	<style>
		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #ffffff;
			overflow: hidden;
		}

		/* Pantalla de bienvenida / menú */
		#overlay {
			position: fixed;
			inset: 0;
			z-index: 100;
			background: #ffffff;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			padding: 24px;
		}
		#overlay[hidden] { display: none; }

		.kora-start-logo {
			display: block;
			width: min(88vw, 470px);
			max-height: 45vh;
			height: auto;
			object-fit: contain;
		}

		.kora-menu {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
		}
		.kora-menu[hidden], #start-button[hidden] { display: none; }

		.kora-action {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 130px;
			padding: 10px 30px;
			background: #F85FAF;
			color: #ffffff;
			border: none;
			border-radius: 14px;
			font: bold 20px/1.2 Georgia, 'Times New Roman', serif;
			text-decoration: none;
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
		}
		.kora-action:active { transform: scale(.97); }

		/* Visor de cada experiencia (Filtro / Realidad) */
		#viewer {
			position: fixed;
			inset: 0;
			z-index: 200;
			background: #ffffff;
		}
		#viewer[hidden] { display: none; }

		#viewer iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
			background: #ffffff;
		}

		/* Flecha para volver al menú */
		#back-button {
			position: absolute;
			z-index: 10;
			top: max(14px, env(safe-area-inset-top));
			left: max(14px, env(safe-area-inset-left));
			width: 46px;
			height: 46px;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			background: #F85FAF;
			border: 0;
			border-radius: 50%;
			box-shadow: 0 4px 14px rgba(44, 27, 40, .25);
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
		}
		#back-button:active { transform: scale(.94); }
		#back-button svg {
			width: 24px;
			height: 24px;
			stroke: #ffffff;
			fill: none;
			stroke-width: 3;
			stroke-linecap: round;
			stroke-linejoin: round;
		}
	</style>
</head>

<body>

	<!-- Pantalla principal -->
	<div id="overlay">
		<img src="assets/kora-logo.png" alt="KORA" class="kora-start-logo">
		<button id="start-button" class="kora-action" type="button" aria-controls="kora-menu">Iniciar</button>
		<div id="kora-menu" class="kora-menu" role="group" aria-label="Experiencias KORA" hidden>
			<button id="filter-button" class="kora-action" type="button" data-url="https://filtrokora.vercel.app/">Filtro</button>
			<button id="reality-button" class="kora-action" type="button" data-url="https://kora-rouge-ten.vercel.app/?directo=1">Realidad</button>
		</div>
	</div>

	<!-- Visor con flecha de regreso -->
	<div id="viewer" hidden>
		<button id="back-button" type="button" aria-label="Volver a elegir Filtro o Realidad">
			<svg viewBox="0 0 24 24" aria-hidden="true">
				<line x1="20" y1="12" x2="5" y2="12"></line>
				<polyline points="11 5 4 12 11 19"></polyline>
			</svg>
		</button>
		<iframe id="viewer-frame" title="Experiencia KORA"
			allow="camera *; microphone *; autoplay *; fullscreen *; accelerometer *; gyroscope *; magnetometer *; xr-spatial-tracking *"
			allowfullscreen></iframe>
	</div>

	<script>
		const overlay = document.getElementById('overlay');
		const startButton = document.getElementById('start-button');
		const koraMenu = document.getElementById('kora-menu');
		const filterButton = document.getElementById('filter-button');
		const realityButton = document.getElementById('reality-button');
		const viewer = document.getElementById('viewer');
		const viewerFrame = document.getElementById('viewer-frame');
		const backButton = document.getElementById('back-button');

		// Iniciar -> muestra las opciones Filtro / Realidad
		startButton.addEventListener('click', () => {
			startButton.hidden = true;
			koraMenu.hidden = false;
			filterButton.focus();
		});

		// Abre una experiencia dentro del visor
		function abrirExperiencia(url) {
			viewerFrame.src = url;
			viewer.hidden = false;
			overlay.hidden = true;
		}

		// Flecha: cierra la experiencia (apaga la cámara) y vuelve al menú
		function volverAlMenu() {
			viewerFrame.src = 'about:blank';
			viewer.hidden = true;
			overlay.hidden = false;
			koraMenu.hidden = false;
			startButton.hidden = true;
		}

		filterButton.addEventListener('click', () => abrirExperiencia(filterButton.dataset.url));
		realityButton.addEventListener('click', () => abrirExperiencia(realityButton.dataset.url));
		backButton.addEventListener('click', volverAlMenu);
	</script>
</body>

</html>
